services:
  mlflow:
    build: {context: ., dockerfile: docker/mlflow.Dockerfile}
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
    ports: ["5000:5000"]
    volumes: ["mlflow_data:/mlflow"]
    healthcheck: &healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build: {context: ., dockerfile: app/Dockerfile}
    ports: ["8000:8000"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ENABLE_DEBUG_ENDPOINTS: ${ENABLE_DEBUG_ENDPOINTS:-false}
      CONFIG_PATH: /app/config.yaml
    volumes: ["./config.yaml:/app/config.yaml:ro"]
    depends_on: {mlflow: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.1
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana_dashboard.json:/var/lib/grafana/dashboards/grafana_dashboard.json:ro
      - grafana_data:/var/lib/grafana
    depends_on: {prometheus: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  pipeline:
    build: {context: ., dockerfile: pipeline/Dockerfile}
    profiles: ["pipeline"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      API_RELOAD_URL: http://api:8000/admin/reload
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      EXECUTOR: ${EXECUTOR:-docker-compose}
      CONFIG_PATH: /app/config.yaml
      ALERTS_DIR: /app/alerts
    volumes:
      - ./data:/data:ro
      - ./config.yaml:/app/config.yaml:ro
      - pipeline_alerts:/app/alerts
    depends_on: {mlflow: {condition: service_healthy}}

volumes:
  mlflow_data:
  prometheus_data:
  grafana_data:
  pipeline_alerts:
